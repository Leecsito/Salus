<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALUS - Asistente Virtual</title>
    <meta name="description" content="SALUS: Asistente virtual de salud y farmacia naturista.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚕️</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">

        <div class="chat-wrapper">
            <header class="chat-header">
                <div class="brand">
                    <div class="avatar">
                        <span class="leaf-icon">⚕️</span>
                    </div>
                    <div class="brand-info">
                        <h1>SALUS</h1>
                        <span class="status">En línea</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="log-btn" class="icon-btn" title="Ver logs del servidor">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                    </button>
                    <button id="reset-btn" class="icon-btn" title="Reiniciar chat">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </header>

            <main class="chat-messages" id="chat-messages">
                <div class="message system-message">
                    <p>Bienvenido a SALUS. ¿En qué te podemos ayudar hoy?</p>
                </div>
            </main>

            <footer class="chat-input-area">
                <form id="chat-form" class="input-form">
                    <input type="text" id="message-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off" required>
                    <button type="submit" class="send-btn" id="send-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </footer>
        </div>

        <aside class="log-panel" id="log-panel" hidden>
            <div class="log-header">
                <span class="log-title">LOGS DEL SERVIDOR</span>
                <span class="log-status ok" id="log-status">en vivo</span>
                <label class="log-auto"><input type="checkbox" id="log-autoscroll" checked> auto</label>
                <button class="log-action" id="log-copy" type="button">Copiar</button>
                <button class="log-action" id="log-clear" type="button">Limpiar</button>
                <button class="log-action" id="log-close" type="button">✕</button>
            </div>
            <div class="log-entries" id="log-entries"></div>
        </aside>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
